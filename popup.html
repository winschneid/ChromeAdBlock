<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Simple Ad Blocker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1c1e;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --off: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1f22; --fg:#e8e9ea; --muted:#9aa0a6; --line:#34363a; }
  }
  body {
    margin: 0; width: 300px;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--fg); font-size: 13px;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .host { margin-top: 4px; color: var(--muted); font-size: 12px; word-break: break-all; }
  section { padding: 14px 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 14px; }
  .label { font-weight: 500; }
  .sub { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.45; }
  .switch { position: relative; flex: none; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: var(--off); border-radius: 22px; transition: background .15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }
  .stats {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; color: var(--muted); font-size: 12px;
  }
  .stats b { color: var(--fg); font-size: 15px; font-variant-numeric: tabular-nums; }
  footer { padding: 10px 16px 14px; display: flex; justify-content: space-between; align-items: center; }
  button.link {
    background: none; border: none; padding: 0; color: var(--accent);
    font: inherit; cursor: pointer;
  }
  button.link:hover { text-decoration: underline; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge.on { background: rgba(37,99,235,.12); color: var(--accent); }
  .badge.off { background: rgba(156,163,175,.2); color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Simple Ad Blocker <span id="siteState" class="badge on">ブロック中</span></h1>
    <div class="host" id="host">読み込み中…</div>
  </header>

  <section>
    <div class="row">
      <div>
        <div class="label">このサイトで広告をブロック</div>
        <div class="sub" id="siteHint">OFFにするとホワイトリストに追加されます</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="siteToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="label">拡張機能全体</div>
        <div class="sub">OFFにするとすべてのサイトで停止します</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="globalToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats">
      <span>このページでブロック</span>
      <span><b id="count">–</b> 件</span>
    </div>
  </section>

  <footer>
    <button class="link" id="options">詳細設定 / ホワイトリスト</button>
    <button class="link" id="reload">再読み込み</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
